services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roadguard
      POSTGRES_USER: roadguard
      POSTGRES_PASSWORD: roadguard-local
    volumes:
      - roadguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadguard -d roadguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://roadguard:roadguard-local@postgres:5432/roadguard
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-deployment}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      MODEL_PATH: /app/models/road_damage.pt
      UPLOAD_DIR: /app/uploads
      PROCESSED_DIR: /app/processed
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  roadguard-db:
